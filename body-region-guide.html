<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>게임 체형 부위 색상표</title>
<style>
:root{color-scheme:dark;background:#17191d;color:#eee;font-family:system-ui,"Malgun Gothic",sans-serif}
*{box-sizing:border-box}body{margin:0;padding:22px;max-width:1000px;margin-inline:auto}
h1{font-size:1.4rem;margin:0 0 8px}p{color:#c6c9d0;line-height:1.6}
#status{padding:10px;background:#242830;border-radius:8px;margin:14px 0}
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.card{background:#22252b;border:1px solid #3c414b;border-radius:10px;padding:12px;text-align:center}
.card h2{font-size:1rem;margin:0 0 8px}.sprite{width:120px;height:184px;image-rendering:pixelated;background-color:#fff;background-image:linear-gradient(45deg,#e8e8e8 25%,transparent 25%),linear-gradient(-45deg,#e8e8e8 25%,transparent 25%),linear-gradient(45deg,transparent 75%,#e8e8e8 75%),linear-gradient(-45deg,transparent 75%,#e8e8e8 75%);background-size:12px 12px;background-position:0 0,0 6px,6px -6px,-6px 0}
.legend{display:flex;flex-wrap:wrap;gap:8px;margin:18px 0}.legend span{display:inline-flex;align-items:center;gap:6px;font-size:.9rem;background:#242830;padding:6px 9px;border-radius:7px}.swatch{width:15px;height:15px;display:inline-block;border:1px solid #ffffff66;border-radius:3px}
button{background:#e9e9e9;color:#17191d;border:0;border-radius:8px;padding:12px 16px;font-weight:700;font-size:1rem}
@media(max-width:600px){body{padding:14px}.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.sprite{width:96px;height:147px}}
</style>
</head>
<body>
<h1>게임 내 체형 부위 색상표</h1>
<p>실제 게임에서 사용하는 몸 스프라이트 9종이야. 각 부위는 게임 내부의 부위 마스크를 기준으로 색칠했어. 아래 PNG 저장을 누른 뒤 이미지 위에 네가 원하는 표시를 추가해서 보내 줘. 체형 실루엣 자체는 바꾸지 않았어.</p>
<div id="status">체형 이미지를 불러오는 중…</div>
<div class="grid" id="grid"></div>
<div class="legend" id="legend"></div>
<button id="download" disabled>색칠된 체형 시트 PNG 저장</button>
<script src="parts.js"></script>
<script>
"use strict";
const palette={
  2:["#f2cf4a","머리"],3:["#ef7777","몸통"],4:["#5b9cf5","왼팔"],5:["#48c6e5","오른팔"],
  6:["#b28bf4","왼손"],7:["#e7a2ef","오른손"],8:["#69c77d","왼쪽 다리"],9:["#37a96b","오른쪽 다리"],
  10:["#f39b55","왼발"],11:["#e96c36","오른발"],12:["#f4a9b8","허리/골반"]
};
const names={F:"여성",M:"남성",O:"중성"};
const ages={0:"어린이",1:"청소년",2:"성인"};
const grid=document.getElementById("grid"), legend=document.getElementById("legend");
const cards=[];
for(const [id,[color,label]] of Object.entries(palette)){const el=document.createElement("span");el.innerHTML='<i class="swatch" style="background:'+color+'"></i>'+label;legend.appendChild(el)}
function loadImg(src){return new Promise((resolve,reject)=>{const im=new Image();im.onload=()=>resolve(im);im.onerror=reject;im.src=src})}
async function makeBody(key,b){
  const [src,mask]=await Promise.all([loadImg(b.img),loadImg(b.reg)]);
  const w=b.w,h=b.h,raw=document.createElement("canvas"),m=document.createElement("canvas");
  raw.width=m.width=w;raw.height=m.height=h;
  const rc=raw.getContext("2d",{willReadFrequently:true}),mc=m.getContext("2d",{willReadFrequently:true});
  rc.drawImage(src,0,0,w,h);mc.drawImage(mask,0,0,w,h);
  const original=rc.getImageData(0,0,w,h),regions=mc.getImageData(0,0,w,h),out=rc.createImageData(w,h);
  for(let i=0;i<out.data.length;i+=4){
    if(!original.data[i+3])continue;
    const r=Math.round(regions.data[i]/20),entry=palette[r];
    if(entry){const hex=entry[0].slice(1);out.data[i]=parseInt(hex.slice(0,2),16);out.data[i+1]=parseInt(hex.slice(2,4),16);out.data[i+2]=parseInt(hex.slice(4,6),16);out.data[i+3]=255}
    else {out.data[i]=180;out.data[i+1]=180;out.data[i+2]=180;out.data[i+3]=255}
  }
  const cv=document.createElement("canvas");cv.width=w;cv.height=h;cv.getContext("2d").putImageData(out,0,0);
  const card=document.createElement("div");card.className="card";
  const title=document.createElement("h2");title.textContent=(names[key[0]]||key[0])+" · "+ages[key[1]];
  const view=document.createElement("canvas");view.className="sprite";view.width=w;view.height=h;view.getContext("2d").drawImage(cv,0,0);
  card.append(title,view);grid.appendChild(card);
  cards.push({key,canvas:cv,title:title.textContent});
}
function downloadSheet(){
 const scale=4,cellW=180,cellH=380,gap=18,cols=3,rows=Math.ceil(cards.length/cols);
 const c=document.createElement("canvas");c.width=cols*cellW+(cols+1)*gap;c.height=rows*cellH+(rows+1)*gap+120;
 const x=c.getContext("2d");x.fillStyle="#fff";x.fillRect(0,0,c.width,c.height);x.fillStyle="#17191d";x.font="bold 26px sans-serif";x.fillText("게임 체형 부위 색상표",gap,38);
 x.font="16px sans-serif";x.fillText("색상은 게임의 실제 부위 마스크 기준",gap,68);
 for(let i=0;i<cards.length;i++){const a=cards[i],cx=gap+(i%cols)*(cellW+gap),cy=100+gap+Math.floor(i/cols)*(cellH+gap);x.fillStyle="#f4f4f4";x.fillRect(cx,cy,cellW,cellH);x.fillStyle="#111";x.font="bold 17px sans-serif";x.fillText(a.title,cx+8,cy+24);x.imageSmoothingEnabled=false;x.drawImage(a.canvas,cx+(cellW-a.canvas.width*scale)/2,cy+36,a.canvas.width*scale,a.canvas.height*scale)}
 const y=c.height-100;x.font="15px sans-serif";let lx=gap,ly=y;
 for(const [id,[color,label]] of Object.entries(palette)){x.fillStyle=color;x.fillRect(lx,ly,15,15);x.fillStyle="#111";x.fillText(label,lx+21,ly+13);lx+=Math.max(82,label.length*16+30);if(lx>c.width-100){lx=gap;ly+=24}}
 const a=document.createElement("a");a.download="game-body-region-sheet.png";a.href=c.toDataURL("image/png");a.click();
}
document.getElementById("download").addEventListener("click",downloadSheet);
(async()=>{try{const P=window.SPRITE_PARTS;if(!P||!P.bodies)throw Error("parts.js 데이터가 없어");for(const key of ["F0","M0","O0","F1","M1","O1","F2","M2","O2"])if(P.bodies[key])await makeBody(key,P.bodies[key]);document.getElementById("status").textContent="완료: 총 "+cards.length+"개 체형을 불러왔어. PNG를 저장해서 부위를 직접 표시해 줘.";document.getElementById("download").disabled=false}catch(e){document.getElementById("status").textContent="불러오지 못했어: "+e.message+" (게임 저장소의 parts.js 파일을 확인해 줘)."}})();
</script>
</body>
</html>
